# Build the web viewer (c/build_web.sh) and publish web/ to GitHub Pages,
# at https://erik-larsen.github.io/big-picture/. The tiles are not built
# here: they live in their own repo, erik-larsen/big-picture-tiles, and
# the page fetches them from https://erik-larsen.github.io/big-picture-tiles/.
name: pages

on:
  push:
    branches: [main]
    paths: [c/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.13
      - run: cd c && ./build_web.sh
      - run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" web/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
