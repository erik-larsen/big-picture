# Build the web viewer (c/build_web.sh) and publish web/ to GitHub Pages,
# at https://erik-larsen.github.io/big-picture/. The tiles are not built
# here: they live in their own repo, erik-larsen/big-picture-tiles, and
# the page fetches them from https://erik-larsen.github.io/big-picture-tiles/.
name: pages

on:
  push:
    branches: [main]
    paths: [c/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.13
      - run: cd c && ./build_web.sh
      - run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
